<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="desktopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <radialGradient id="ambientGlow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientGlow2" cx="75%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadowHeavy" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="shadowMedium" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="acrylicBlur">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Desktop Surface -->
  <rect width="1000" height="640" rx="16" fill="url(#desktopBg)" />
  <rect width="1000" height="640" rx="16" fill="url(#ambientGlow1)" />
  <rect width="1000" height="640" rx="16" fill="url(#ambientGlow2)" />

  <!-- Subtle Desktop Grid Dots -->
  <g opacity="0.15" fill="#94A3B8">
    <circle cx="100" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/><circle cx="400" cy="100" r="1.5"/><circle cx="500" cy="100" r="1.5"/><circle cx="600" cy="100" r="1.5"/><circle cx="700" cy="100" r="1.5"/><circle cx="800" cy="100" r="1.5"/><circle cx="900" cy="100" r="1.5"/>
    <circle cx="100" cy="200" r="1.5"/><circle cx="200" cy="200" r="1.5"/><circle cx="300" cy="200" r="1.5"/><circle cx="400" cy="200" r="1.5"/><circle cx="500" cy="200" r="1.5"/><circle cx="600" cy="200" r="1.5"/><circle cx="700" cy="200" r="1.5"/><circle cx="800" cy="200" r="1.5"/><circle cx="900" cy="200" r="1.5"/>
    <circle cx="100" cy="300" r="1.5"/><circle cx="200" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/><circle cx="400" cy="300" r="1.5"/><circle cx="500" cy="300" r="1.5"/><circle cx="600" cy="300" r="1.5"/><circle cx="700" cy="300" r="1.5"/><circle cx="800" cy="300" r="1.5"/><circle cx="900" cy="300" r="1.5"/>
    <circle cx="100" cy="400" r="1.5"/><circle cx="200" cy="400" r="1.5"/><circle cx="300" cy="400" r="1.5"/><circle cx="400" cy="400" r="1.5"/><circle cx="500" cy="400" r="1.5"/><circle cx="600" cy="400" r="1.5"/><circle cx="700" cy="400" r="1.5"/><circle cx="800" cy="400" r="1.5"/><circle cx="900" cy="400" r="1.5"/>
    <circle cx="100" cy="500" r="1.5"/><circle cx="200" cy="500" r="1.5"/><circle cx="300" cy="500" r="1.5"/><circle cx="400" cy="500" r="1.5"/><circle cx="500" cy="500" r="1.5"/><circle cx="600" cy="500" r="1.5"/><circle cx="700" cy="500" r="1.5"/><circle cx="800" cy="500" r="1.5"/><circle cx="900" cy="500" r="1.5"/>
  </g>

  <!-- ==========================================
       NOTE 1: Pastel Yellow (Sprint Goals & Checklist)
       ========================================== -->
  <g transform="translate(60, 50)" filter="url(#shadowHeavy)">
    <!-- Note Body -->
    <rect width="360" height="420" rx="10" fill="#FEF08A" />
    
    <!-- Title Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 350 0 Q 360 0 360 10 L 360 42 L 0 42 Z" fill="#FDE047" />
    
    <!-- Window Controls -->
    <circle cx="22" cy="21" r="5" fill="#EAB308" />
    <text x="36" y="26" class="font-sans" font-size="13" font-weight="700" fill="#713F12">Sprint Planning Q4</text>
    <rect x="290" y="11" width="22" height="20" rx="4" fill="#FEF08A" opacity="0.8" />
    <text x="295" y="25" class="font-sans" font-size="12" fill="#713F12">📌</text>
    <text x="330" y="25" class="font-sans" font-size="14" fill="#854D0E" font-weight="600">×</text>

    <!-- Metadata Badges -->
    <g transform="translate(18, 52)">
      <rect width="48" height="18" rx="4" fill="#000000" opacity="0.08" />
      <text x="8" y="13" class="font-sans" font-size="10" font-weight="700" fill="#713F12">WORK</text>

      <rect x="54" width="60" height="18" rx="4" fill="#000000" opacity="0.08" />
      <text x="60" y="13" class="font-sans" font-size="10" fill="#713F12">Projects</text>

      <rect x="120" width="100" height="18" rx="4" fill="#EA580C" opacity="0.15" />
      <text x="126" y="13" class="font-sans" font-size="10" font-weight="600" fill="#C2410C">⏰ Today, 6:00 PM</text>
    </g>

    <!-- Note Content: Interactive Checklist -->
    <g transform="translate(20, 92)" class="font-sans">
      <!-- Item 1 (Checked) -->
      <g transform="translate(0, 0)">
        <rect width="18" height="18" rx="4" fill="#15803D" />
        <path d="M 4 9 L 7 12 L 14 5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="28" y="14" font-size="13" fill="#854D0E" text-decoration="line-through" opacity="0.7">Migrate storage to asynchronous saves</text>
      </g>

      <!-- Item 2 (Checked) -->
      <g transform="translate(0, 32)">
        <rect width="18" height="18" rx="4" fill="#15803D" />
        <path d="M 4 9 L 7 12 L 14 5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="28" y="14" font-size="13" fill="#854D0E" text-decoration="line-through" opacity="0.7">Add background reminder notifications</text>
      </g>

      <!-- Item 3 (Unchecked) -->
      <g transform="translate(0, 64)">
        <rect width="18" height="18" rx="4" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.8" />
        <text x="28" y="14" font-size="13" fill="#713F12" font-weight="600">Review PR for multi-workspace support</text>
      </g>

      <!-- Item 4 (Unchecked) -->
      <g transform="translate(0, 96)">
        <rect width="18" height="18" rx="4" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.8" />
        <text x="28" y="14" font-size="13" fill="#713F12" font-weight="600">Test Wayland global shortcut hook</text>
      </g>

      <!-- Item 5 (Unchecked) -->
      <g transform="translate(0, 128)">
        <rect width="18" height="18" rx="4" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.8" />
        <text x="28" y="14" font-size="13" fill="#713F12" font-weight="600">Deploy release v1.0.0 to Vercel</text>
      </g>
    </g>

    <!-- Progress Indicator -->
    <g transform="translate(20, 270)">
      <rect width="320" height="6" rx="3" fill="#E2E8F0" opacity="0.6" />
      <rect width="128" height="6" rx="3" fill="#16A34A" />
      <text x="0" y="24" class="font-sans" font-size="11" fill="#854D0E" font-weight="600">2 of 5 tasks completed (40%)</text>
    </g>

    <!-- Bottom Action Ribbon -->
    <g transform="translate(0, 375)">
      <rect width="360" height="45" rx="0" fill="#FEF9C3" opacity="0.7" />
      <text x="20" y="28" class="font-sans" font-size="11" fill="#A16207">+ Add new item</text>
      <text x="260" y="28" class="font-sans" font-size="11" fill="#A16207">Checklist Mode</text>
    </g>
  </g>

  <!-- ==========================================
       NOTE 2: Crystal Clear Frosted Glass Note (Right)
       ========================================== -->
  <g transform="translate(480, 70)" filter="url(#shadowHeavy)">
    <!-- Frosted Glass Body -->
    <rect width="440" height="380" rx="12" fill="#1E293B" fill-opacity="0.65" stroke="#475569" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Translucent Title Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 428 0 Q 440 0 440 12 L 440 44 L 0 44 Z" fill="#334155" fill-opacity="0.5" />
    
    <circle cx="24" cy="22" r="5" fill="#38BDF8" />
    <text x="38" y="27" class="font-sans" font-size="13" font-weight="600" fill="#F8FAFC">Code Snippet (Markdown)</text>
    <rect x="360" y="12" width="28" height="20" rx="4" fill="#38BDF8" fill-opacity="0.2" />
    <text x="366" y="26" class="font-sans" font-size="10" font-weight="700" fill="#38BDF8">MD</text>
    <text x="410" y="26" class="font-sans" font-size="15" fill="#94A3B8">×</text>

    <!-- Category & Tags -->
    <g transform="translate(20, 56)">
      <rect width="52" height="18" rx="4" fill="#38BDF8" fill-opacity="0.15" />
      <text x="8" y="13" class="font-sans" font-size="10" font-weight="600" fill="#38BDF8">DEV</text>

      <rect x="58" width="60" height="18" rx="4" fill="#F8FAFC" fill-opacity="0.1" />
      <text x="66" y="13" class="font-sans" font-size="10" fill="#CBD5E1">#csharp</text>

      <rect x="124" width="60" height="18" rx="4" fill="#F8FAFC" fill-opacity="0.1" />
      <text x="132" y="13" class="font-sans" font-size="10" fill="#CBD5E1">#dotnet</text>
    </g>

    <!-- Markdown Rendered Preview inside Crystal Clear -->
    <g transform="translate(20, 92)" class="font-sans">
      <text x="0" y="18" font-size="16" font-weight="700" fill="#FFFFFF"># Instant Note Trigger</text>
      <text x="0" y="38" font-size="12" fill="#94A3B8">Bind global shortcut via IPC client pipeline:</text>

      <!-- Fenced Code Block -->
      <g transform="translate(0, 52)">
        <rect width="400" height="120" rx="8" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        
        <text x="16" y="28" class="font-mono" font-size="12" fill="#F43F5E">public static async Task</text>
        <text x="175" y="28" class="font-mono" font-size="12" fill="#38BDF8">SendAsync</text>
        <text x="245" y="28" class="font-mono" font-size="12" fill="#E2E8F0">(string cmd)</text>

        <text x="16" y="52" class="font-mono" font-size="12" fill="#E2E8F0">{</text>
        <text x="32" y="74" class="font-mono" font-size="12" fill="#94A3B8">// Zero latency Unix socket / Named Pipe</text>
        <text x="32" y="96" class="font-mono" font-size="12" fill="#F43F5E">await </text>
        <text x="75" y="96" class="font-mono" font-size="12" fill="#E2E8F0">pipe.</text>
        <text x="110" y="96" class="font-mono" font-size="12" fill="#38BDF8">WriteLineAsync</text>
        <text x="215" y="96" class="font-mono" font-size="12" fill="#FBBF24">("NEW_NOTE")</text>
        <text x="295" y="96" class="font-mono" font-size="12" fill="#E2E8F0">;</text>
        <text x="16" y="114" class="font-mono" font-size="12" fill="#E2E8F0">}</text>
      </g>

      <!-- Blockquote -->
      <g transform="translate(0, 186)">
        <rect x="0" y="0" width="3" height="34" fill="#38BDF8" rx="1.5" />
        <text x="12" y="14" font-size="11" font-style="italic" fill="#CBD5E1">"Crystal clear mode renders transparent frosted acrylic</text>
        <text x="12" y="28" font-size="11" font-style="italic" fill="#CBD5E1">blur without stealing window focus."</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <g transform="translate(20, 340)">
      <text x="0" y="14" class="font-sans" font-size="11" fill="#64748B">✨ Crystal Clear Acrylic Blur • 100% Native</text>
    </g>
  </g>

  <!-- ==========================================
       NOTE 3: Pastel Soft Lavender Note (Bottom Overlap)
       ========================================== -->
  <g transform="translate(200, 360)" filter="url(#shadowMedium)">
    <!-- Note Body -->
    <rect width="380" height="230" rx="10" fill="#EDE9FE" />
    
    <!-- Title Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 370 0 Q 380 0 380 10 L 380 40 L 0 40 Z" fill="#DDD6FE" />
    
    <circle cx="20" cy="20" r="5" fill="#8B5CF6" />
    <text x="34" y="25" class="font-sans" font-size="13" font-weight="700" fill="#4C1D95">Study Notes: Algorithms</text>
    <text x="350" y="24" class="font-sans" font-size="14" fill="#5B21B6">×</text>

    <!-- Badges -->
    <g transform="translate(18, 50)">
      <rect width="52" height="16" rx="4" fill="#000000" opacity="0.08" />
      <text x="8" y="12" class="font-sans" font-size="9" font-weight="700" fill="#4C1D95">STUDY</text>

      <rect x="58" width="70" height="16" rx="4" fill="#000000" opacity="0.08" />
      <text x="64" y="12" class="font-sans" font-size="9" fill="#4C1D95">University</text>
    </g>

    <!-- Content -->
    <g transform="translate(18, 82)" class="font-sans" fill="#2E1065">
      <text x="0" y="14" font-size="12" font-weight="700">• Dynamic Programming vs Memoization</text>
      <text x="12" y="32" font-size="11" fill="#5B21B6">- Top-down recursion with table cache avoids duplicate tree traversals.</text>
      <text x="12" y="48" font-size="11" fill="#5B21B6">- Time complexity bounded to O(V + E) for DAG shortest paths.</text>
      
      <text x="0" y="74" font-size="12" font-weight="700">• Next Reading Assignment:</text>
      <text x="12" y="92" font-size="11" fill="#5B21B6">Chapter 14 (Graph Flow Networks) — Due Monday 9:00 AM</text>
    </g>

    <!-- Bottom Bar -->
    <g transform="translate(18, 195)">
      <text x="0" y="14" class="font-sans" font-size="10" fill="#7C3AED">Last edited 4 mins ago • Workspace: University</text>
    </g>
  </g>

  <!-- Floating Toast Notification (Top Right corner) -->
  <g transform="translate(680, 480)" filter="url(#shadowMedium)">
    <rect width="280" height="70" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="35" r="14" fill="#22C55E" fill-opacity="0.2" />
    <text x="21" y="41" class="font-sans" font-size="14">⏰</text>
    <text x="52" y="30" class="font-sans" font-size="12" font-weight="700" fill="#F8FAFC">PinNote Reminder</text>
    <text x="52" y="48" class="font-sans" font-size="11" fill="#94A3B8">Sprint Planning starts in 10 mins</text>
  </g>
</svg>

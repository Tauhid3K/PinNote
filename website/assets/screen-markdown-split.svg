<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadowHeavy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Background -->
  <rect width="960" height="600" rx="16" fill="url(#bgGrad)" />

  <!-- Window Container -->
  <g transform="translate(60, 40)" filter="url(#shadowHeavy)">
    <!-- Window Outer Shell -->
    <rect width="840" height="520" rx="12" fill="#E2F7D1" />
    
    <!-- Title Bar -->
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 828 0 A 12 12 0 0 1 840 12 L 840 44 L 0 44 Z" fill="#C5ECC0" />
    <text x="18" y="27" class="font-sans" font-size="13" font-weight="700" fill="#1E293B">API Architecture &amp; Release Specs</text>
    
    <!-- Title Bar Controls -->
    <!-- Pin Button (Active) -->
    <g transform="translate(680, 10)">
      <rect width="28" height="24" rx="4" fill="#0F172A" opacity="0.12" />
      <text x="7" y="16" font-size="12">📌</text>
    </g>
    <!-- Options menu -->
    <g transform="translate(716, 10)">
      <rect width="28" height="24" rx="4" fill="#0F172A" opacity="0.08" />
      <text x="10" y="17" class="font-sans" font-weight="bold" font-size="14" fill="#334155">⋯</text>
    </g>
    <!-- Minimize & Close -->
    <g transform="translate(752, 10)">
      <rect width="24" height="24" rx="4" fill="transparent" />
      <line x1="6" y1="13" x2="18" y2="13" stroke="#334155" stroke-width="1.8" />
    </g>
    <g transform="translate(784, 10)">
      <rect width="24" height="24" rx="4" fill="transparent" />
      <line x1="6" y1="6" x2="18" y2="18" stroke="#334155" stroke-width="1.8" />
      <line x1="18" y1="6" x2="6" y2="18" stroke="#334155" stroke-width="1.8" />
    </g>

    <!-- Metadata Bar -->
    <g transform="translate(18, 54)">
      <!-- Category -->
      <rect x="0" y="0" width="76" height="20" rx="4" fill="#000000" opacity="0.12" />
      <text x="8" y="14" class="font-sans" font-size="11" font-weight="600" fill="#1E293B">Architecture</text>

      <!-- Workspace -->
      <rect x="84" y="0" width="86" height="20" rx="4" fill="#000000" opacity="0.12" />
      <text x="92" y="14" class="font-sans" font-size="11" fill="#1E293B">Engineering</text>

      <!-- Reminder -->
      <rect x="178" y="0" width="126" height="20" rx="4" fill="#FF9800" opacity="0.22" />
      <text x="186" y="14" class="font-sans" font-size="11" fill="#9A3412">⏰ Today 04:30 PM</text>

      <!-- Mode Pill -->
      <rect x="312" y="0" width="112" height="20" rx="4" fill="#3B82F6" opacity="0.2" />
      <text x="320" y="14" class="font-sans" font-size="11" font-weight="600" fill="#1D4ED8">MD Live Preview</text>

      <!-- Tags -->
      <rect x="432" y="0" width="62" height="20" rx="4" fill="#000000" opacity="0.1" />
      <text x="440" y="14" class="font-sans" font-size="11" fill="#1E293B">#v1.0.0</text>
      
      <rect x="500" y="0" width="70" height="20" rx="4" fill="#000000" opacity="0.1" />
      <text x="508" y="14" class="font-sans" font-size="11" fill="#1E293B">#backend</text>
    </g>

    <!-- Split Pane Divider -->
    <rect x="18" y="86" width="394" height="416" rx="8" fill="#FFFFFF" fill-opacity="0.85" filter="url(#cardShadow)" />
    <rect x="428" y="86" width="394" height="416" rx="8" fill="#FFFFFF" fill-opacity="0.95" filter="url(#cardShadow)" />

    <!-- Left Pane: Markdown Source Edit -->
    <g transform="translate(32, 102)">
      <rect x="0" y="0" width="70" height="18" rx="3" fill="#E2E8F0" />
      <text x="6" y="13" class="font-mono" font-size="9.5" font-weight="700" fill="#475569">SOURCE EDIT</text>

      <text x="0" y="42" class="font-mono" font-size="12" fill="#0F172A">
        <tspan fill="#2563EB" font-weight="bold"># Phase 1: Storage Layer</tspan>
      </text>
      <text x="0" y="66" class="font-mono" font-size="11" fill="#475569">Atomic JSON persistence with safe backups:</text>
      <text x="0" y="90" class="font-mono" font-size="11" fill="#0F172A">- [x] Multi-platform directory resolve</text>
      <text x="0" y="112" class="font-mono" font-size="11" fill="#0F172A">- [x] Debounced flush (500ms queue)</text>
      <text x="0" y="134" class="font-mono" font-size="11" fill="#0F172A">- [ ] Monotonic lock with retry policy</text>

      <text x="0" y="168" class="font-mono" font-size="12" fill="#2563EB" font-weight="bold">## Code Snippet</tspan></text>
      <text x="0" y="190" class="font-mono" font-size="11" fill="#7C3AED">```csharp</text>
      <text x="0" y="210" class="font-mono" font-size="11" fill="#0F172A">public async Task SaveAsync(Note note)</text>
      <text x="0" y="228" class="font-mono" font-size="11" fill="#0F172A">{</text>
      <text x="12" y="246" class="font-mono" font-size="11" fill="#64748B">  // Atomic write to disk</text>
      <text x="12" y="264" class="font-mono" font-size="11" fill="#0F172A">  await File.WriteAllTextAsync(...);</text>
      <text x="0" y="282" class="font-mono" font-size="11" fill="#0F172A">}</text>
      <text x="0" y="302" class="font-mono" font-size="11" fill="#7C3AED">```</text>

      <text x="0" y="336" class="font-mono" font-size="11" fill="#475569">> Shortcut: Press <tspan fill="#D97706" font-weight="bold">Ctrl+M</tspan> anytime to toggle</text>
      <text x="0" y="356" class="font-mono" font-size="11" fill="#475569">> between editing and preview mode.</text>
    </g>

    <!-- Right Pane: Rendered Markdown -->
    <g transform="translate(442, 102)">
      <rect x="0" y="0" width="80" height="18" rx="3" fill="#DCFCE7" />
      <text x="6" y="13" class="font-sans" font-size="9.5" font-weight="700" fill="#15803D">LIVE PREVIEW</text>

      <!-- Heading 1 -->
      <text x="0" y="44" class="font-sans" font-size="17" font-weight="800" fill="#0F172A">Phase 1: Storage Layer</text>
      <text x="0" y="68" class="font-sans" font-size="12" fill="#475569">Atomic JSON persistence with safe backups:</text>
      
      <!-- Checkbox 1 (Checked) -->
      <g transform="translate(0, 80)">
        <rect width="14" height="14" rx="3" fill="#16A34A" />
        <path d="M 3 7 L 6 10 L 11 4" stroke="#FFFFFF" stroke-width="2" fill="none" />
        <text x="22" y="12" class="font-sans" font-size="12" fill="#166534" text-decoration="line-through">Multi-platform directory resolve</text>
      </g>

      <!-- Checkbox 2 (Checked) -->
      <g transform="translate(0, 104)">
        <rect width="14" height="14" rx="3" fill="#16A34A" />
        <path d="M 3 7 L 6 10 L 11 4" stroke="#FFFFFF" stroke-width="2" fill="none" />
        <text x="22" y="12" class="font-sans" font-size="12" fill="#166534" text-decoration="line-through">Debounced flush (500ms queue)</text>
      </g>

      <!-- Checkbox 3 (Unchecked) -->
      <g transform="translate(0, 128)">
        <rect width="14" height="14" rx="3" fill="none" stroke="#94A3B8" stroke-width="1.6" />
        <text x="22" y="12" class="font-sans" font-size="12" font-weight="600" fill="#0F172A">Monotonic lock with retry policy</text>
      </g>

      <!-- Heading 2 -->
      <text x="0" y="172" class="font-sans" font-size="14" font-weight="700" fill="#1E293B">Code Snippet</text>
      
      <!-- Styled Code Box -->
      <rect x="0" y="184" width="364" height="126" rx="6" fill="#0F172A" />
      <g transform="translate(14, 196)">
        <text x="0" y="14" class="font-mono" font-size="10.5" fill="#38BDF8">public async Task <tspan fill="#FDE047">SaveAsync</tspan>(Note note)</text>
        <text x="0" y="32" class="font-mono" font-size="10.5" fill="#E2E8F0">{</text>
        <text x="12" y="50" class="font-mono" font-size="10.5" fill="#94A3B8">// Atomic write to disk</text>
        <text x="12" y="68" class="font-mono" font-size="10.5" fill="#C084FC">await <tspan fill="#E2E8F0">File.</tspan><tspan fill="#FDE047">WriteAllTextAsync</tspan>(...);</text>
        <text x="0" y="86" class="font-mono" font-size="10.5" fill="#E2E8F0">}</text>
      </g>

      <!-- Callout Quote Box -->
      <rect x="0" y="324" width="364" height="52" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" />
      <g transform="translate(12, 342)">
        <text x="0" y="12" class="font-sans" font-size="11" font-weight="600" fill="#92400E">💡 Pro Tip:</text>
        <text x="56" y="12" class="font-sans" font-size="11" fill="#78350F">Press <tspan font-family="'JetBrains Mono', monospace" font-weight="bold">Ctrl+M</tspan> anytime to toggle between</text>
        <text x="0" y="27" class="font-sans" font-size="11" fill="#78350F">plain markdown editing and styled live preview.</text>
      </g>
    </g>
  </g>
</svg>

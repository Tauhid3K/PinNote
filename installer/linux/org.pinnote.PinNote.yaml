app-id: org.pinnote.PinNote
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: PinNote
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-config/autostart:create
modules:
  - name: pinnote
    buildsystem: simple
    build-commands:
      - install -D PinNote /app/bin/PinNote
      - install -D org.pinnote.PinNote.desktop /app/share/applications/org.pinnote.PinNote.desktop
      - install -D Assets/icon.png /app/share/icons/hicolor/128x128/apps/org.pinnote.PinNote.png
    sources:
      - type: dir
        path: ../../artifacts/publish/linux-x64
      - type: file
        path: org.pinnote.PinNote.desktop
